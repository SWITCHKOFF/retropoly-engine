# ============================================================================
# Автолейблинг issue без шаблона — Спринт 19–20
# (docs/DEVELOPMENT_PLAN.md §6).
# ============================================================================
name: issue-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label issue without template
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const hasTemplate = /##?\s*(Описание|Description)/i.test(body);
            if (!hasTemplate) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-info']
              });
            }
