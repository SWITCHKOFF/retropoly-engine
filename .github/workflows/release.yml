# ============================================================================
# Release workflow — Спринт 37–38 (release gate v2).
#
# Триггер: annotated tag v* (после release freeze — только draft).
#   1. sdk / ui — переиспользуемые workflow S33–36: собирают SDK-архивы
#      PC/PS1/Saturn и UI-пакеты Linux/Windows/macOS, каждый со smoke.
#   2. release-gate — скачивает артефакты SDK/UI, собирает legacy PC/PS1/
#      Saturn demo-образы, запускает verify_release_contract.py, clean-room
#      consumer/UI E2E, negative-tests и собирает payload sdk/ + ui/.
#   3. publish — создаёт DRAFT GitHub Release только если оба отчёта
#      all_ok: true; публикация — не ранее v0.9.x, вручную после приёмки.
#
# RELEASE FREEZE (2026-11-14): любая публикация релизов отложена до v0.9.x.
# v0.2.1 GitHub Release удалён/отозван; автоматический public release
# запрещён. Политика: docs/RELEASING.md.
# ============================================================================
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sdk:
    name: SDK packages
    uses: ./.github/workflows/sdk-package.yml

  ui:
    name: UI packages
    uses: ./.github/workflows/ui-client.yml

  release-gate:
    name: Release gate v2 (${{ github.ref_name }})
    needs: [sdk, ui]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            xvfb mesa-utils libgl1-mesa-dri python3-yaml genisoimage unzip

      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: retro-engine-sdk-*
          path: dist
          merge-multiple: true

      - name: Download UI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: retro-engine-ui-*
          path: dist
          merge-multiple: true

      - name: Verify vendored dependencies
        run: sh ci/verify_vendored.sh

      - name: Build pc-debug + tests
        run: |
          cmake --preset pc-debug
          cmake --build --preset pc-debug

      - name: Build pc-debug-render
        run: |
          cmake --preset pc-debug-render
          cmake --build --preset pc-debug-render

      - name: Build pc-release + examples
        run: |
          cmake --preset pc-release
          cmake --build --preset pc-release

      - name: Unit tests
        run: ctest --preset pc-debug --output-on-failure

      - name: Render tests (xvfb)
        run: xvfb-run -a ctest --preset pc-debug-render --output-on-failure

      - name: PSn00bSDK v0.24 (pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psn00bsdk"
          cd "$RUNNER_TEMP/psn00bsdk"
          curl -fSL --retry 2 -o PSn00bSDK-0.24-Linux.zip \
            https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.24/PSn00bSDK-0.24-Linux.zip
          sha256sum -c "$GITHUB_WORKSPACE/ci/psn00bsdk-v0.24-linux.sha256"
          unzip -q PSn00bSDK-0.24-Linux.zip -d "$HOME"
          mv "$HOME/PSn00bSDK-0.24-Linux" "$HOME/PSn00bSDK"
          echo "PSN00BSDK_LIBS=$HOME/PSn00bSDK/lib/libpsn00b" >> "$GITHUB_ENV"

      - name: Build ps1-release
        run: |
          cmake --preset ps1-release
          cmake --build --preset ps1-release

      - name: Validate PS1 artifacts
        run: |
          set -euo pipefail
          cd build/ps1-release/src/hal/ps1
          test -s retro_ps1.elf
          test -s retro_ps1.exe
          test -s RETRO.bin
          test -s RETRO.cue
          grep -Fx 'BOOT = cdrom:\RETRO.EXE;1' system.cnf

      - name: Jo Engine v2026.2 (pinned, Saturn)
        run: |
          set -euo pipefail
          git config --global advice.detachedHead false
          git clone --depth 1 --branch v2026.2 --filter=blob:none --sparse \
            https://github.com/johannes-fetz/joengine.git "$RUNNER_TEMP/joengine"
          cd "$RUNNER_TEMP/joengine"
          git sparse-checkout set \
            Compiler/COMMON Compiler/LINUX \
            Compiler/WINDOWS/sh-elf/include jo_engine
          test "$(git rev-parse HEAD)" = "5e99944238030821a48e17a40abefd77e81953c2"
          sha256sum -c "$GITHUB_WORKSPACE/ci/joengine-v2026.2.sha256"
          echo "JO_ENGINE_ROOT=$RUNNER_TEMP/joengine" >> "$GITHUB_ENV"

      - name: Build saturn-release (hello_triangle)
        run: |
          cmake --preset saturn-release
          cmake --build --preset saturn-release

      - name: Validate Saturn artifacts
        run: |
          set -euo pipefail
          cd build/saturn-release/src/hal/saturn
          for f in hello_triangle.elf hello_triangle.bin hello_triangle.iso \
                   hello_triangle.cue hello_triangle.map; do
            test -s "$f"
          done
          cmp hello_triangle.iso retro_saturn.iso
          cmp hello_triangle.bin retro_saturn.bin
          grep -Fx 'FILE "hello_triangle.iso" BINARY' hello_triangle.cue
          isoinfo -i hello_triangle.iso -f | grep -q '/0.BIN;1'
          isoinfo -i hello_triangle.iso -f | grep -q '/CUBE.MSH;1'
          isoinfo -i hello_triangle.iso -f | grep -q '/TEX0.TEX;1'
          isoinfo -i hello_triangle.iso -f | grep -q '/TEX1.TEX;1'

      - name: Prepare optional demo images
        run: |
          set -euo pipefail
          mkdir -p dist/demos/pc dist/demos/ps1 dist/demos/saturn
          cp build/pc-release/game/hello_triangle \
             build/pc-release/game/rotating_cube dist/demos/pc/
          cp build/ps1-release/src/hal/ps1/RETRO.bin \
             build/ps1-release/src/hal/ps1/RETRO.cue \
             build/ps1-release/src/hal/ps1/retro_ps1.exe dist/demos/ps1/
          cp build/saturn-release/src/hal/saturn/hello_triangle.elf \
             build/saturn-release/src/hal/saturn/hello_triangle.bin \
             build/saturn-release/src/hal/saturn/hello_triangle.iso \
             build/saturn-release/src/hal/saturn/hello_triangle.cue \
             build/saturn-release/src/hal/saturn/hello_triangle.map \
             dist/demos/saturn/

      - name: Release contract v2 (build checks)
        run: |
          set -euo pipefail
          SDK="$(ls dist/retro-engine-sdk-*-pc-linux-*.tar.gz | head -n 1)"
          UI="$(ls dist/retro-engine-ui-*-linux-*.tar.gz | head -n 1)"
          xvfb-run -a python3 scripts/verify_release_contract.py \
            --w1-seconds 60 --skip-payload \
            --sdk-archive "$SDK" --ui-archive "$UI" \
            --output release_contract_report.json

      - name: Clean-room UI E2E (SDK archive + UI package)
        run: |
          set -euo pipefail
          SDK="$(ls dist/retro-engine-sdk-*-pc-linux-*.tar.gz | head -n 1)"
          UI="$(ls dist/retro-engine-ui-*-linux-*.tar.gz | head -n 1)"
          xvfb-run -a python3 scripts/ui_e2e.py \
            --sdk-archive "$SDK" --ui-package "$UI" \
            --screenshot-dir dist/ui-screenshots

      - name: Build SDK+UI release bundle
        run: |
          set -euo pipefail
          SDK="$(ls dist/retro-engine-sdk-*-pc-linux-*.tar.gz | head -n 1)"
          UI="$(ls dist/retro-engine-ui-*-linux-*.tar.gz | head -n 1)"
          python3 scripts/build_release_bundle.py \
            --sdk-archive "$SDK" --ui-archive "$UI" \
            --report release_contract_report.json \
            --demos-dir dist/demos

      - name: Payload gate (sdk/ + ui/ + checksums)
        run: |
          python3 scripts/verify_release_contract.py --payload-only \
            --payload-dir "dist/retro-engine-v${GITHUB_REF_NAME#v}" \
            --output payload_verification_report.json

      - name: Negative-tests (missing SDK/UI/checksum, BIOS/ROM)
        run: |
          python3 scripts/release_gate_negative_tests.py \
            --bundle-dir "dist/retro-engine-v${GITHUB_REF_NAME#v}"

      - name: Assert all reports green
        run: |
          python3 - <<'PY'
          import json
          for path in ("release_contract_report.json",
                       "payload_verification_report.json"):
              with open(path, encoding="utf-8") as f:
                  report = json.load(f)
              if report.get("all_ok") is not True:
                  raise SystemExit("%s: all_ok is not true" % path)
              print("%s: all_ok=true (version %s)" %
                    (path, report.get("version")))
          PY

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/retro-engine-v*.tar.gz dist/retro-engine-v*.tar.gz.sha256 \
             release-assets/
          cp dist/retro-engine-sdk-* dist/retro-engine-ui-* release-assets/
          cp release_contract_report.json payload_verification_report.json \
             release-assets/
          ls -lh release-assets

      - name: Upload release gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Create draft GitHub Release
    needs: release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-gate-artifacts
          path: release-assets

      - name: Verify reports and generate asset checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for path in ("release-assets/release_contract_report.json",
                       "release-assets/payload_verification_report.json"):
              with open(path, encoding="utf-8") as f:
                  report = json.load(f)
              if report.get("all_ok") is not True:
                  raise SystemExit("%s: all_ok is not true" % path)
          PY
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import release_payload
          bad = release_payload._forbidden_entries("release-assets")
          if bad:
              raise SystemExit("forbidden release assets: " +
                               ", ".join(bad[:20]))
          print("release-assets: no BIOS/ROM/secrets/build dirs")
          PY
          cd release-assets
          find . -maxdepth 1 -type f ! -name checksums.sha256 -printf '%P\n' \
            | sort | while read -r file; do sha256sum "$file"; done \
            > checksums.sha256
          sha256sum -c checksums.sha256

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RetroPolyEngine ${{ github.ref_name }} — SDK + UI client
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/retro-engine-v*.tar.gz
            release-assets/retro-engine-v*.tar.gz.sha256
            release-assets/retro-engine-sdk-*
            release-assets/retro-engine-ui-*
            release-assets/checksums.sha256
            release-assets/release_contract_report.json
            release-assets/payload_verification_report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
