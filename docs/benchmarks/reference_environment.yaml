# SPDX-License-Identifier: MIT
# RetroPolyEngine — docs/benchmarks/reference_environment.yaml
#
# Каркас метаданных эталонного окружения (docs/plans/sprint_07_08.md,
# неделя 16). НАЗНАЧЕНИЕ: любой повторный прогон эталонных замеров
# (W0-golden, benchmarks/memory_baseline.md и буд.) сопровождается
# снапшотом значений этого файла — числа без окружения недействительны.
#
# Политика обновления: при переносе эталонных прогонов на другое окружение
# ИЛИ при плановом апгрейде тулчейна значения перезаписываются, дата и
# причина — в notes (без изменения схемы). Полка «measurement» — только
# сравнение внутри одного снапшота (числа без окружения недействительны).
#
# Поля (норматив недель 16): os / cpu / gpu / driver / compiler /
# build_type / resolutions / vsync / power_mode / measurement_seconds /
# git_revision / asset_set_sha256.

os: >-
  Freedesktop SDK 25.08 (Flatpak runtime), Linux 7.0.0-42 x86_64

cpu: >-
  Intel Core i5-11300H (11th Gen, Tiger Lake-H35, 4C/8T @ 3.10–4.40 GHz)

gpu: >-
  VMware SVGA II Adapter (виртуализированный SVGA; GL-контекст через
  Mesa/userspace драйвер)

driver: >-
  Mesa GL (desktop, GL 3.3 core profile — требование render_opengl.cpp);
  версия уточняется на повторном прогоне (glxinfo отсутствовал в образе)

compiler: >-
  GCC 15.2.0 (mipsel-none-elf-g++ 12.3.0 для PS1-пресетов), CMake 4.4.4,
  Ninja 1.13.2

build_type: >-
  pc-debug-render для golden-эталонов (BUILD_RENDER_INTEGRATION_TESTS=ON,
  бинарь retro_engine_visual_tests); pc-release/pc-asan — замеры
  производительности/подавления диагностики; ps1-release — сборка ELF.

resolutions: >-
  [320×240 (reference framebuffer; nearest→окно), 1280×960 (окно HAL)]

vsync: >-
  off в контексте тестового процесса (кадр не ждёт вертикальной
  синхронизации; детерминизм readback от vsync не зависит).

power_mode: >-
  AC (сетевое питание); governor/частоты не пинились — «правило честных
  замеров»: сравнение только внутри одного снапшота этого файла.

measurement_seconds: 60

git_revision: >-
  dfa123c (W1 hello_triangle; игровой слой примера — a32ce48, HAL-мышь
  0dcacf8). Снапшот окружения снят при замере W1-полки
  bench-режимом examples/hello_triangle (60 с).

asset_set_sha256: >-
  235ef802ce58341f22468aaaad603ba9f6b6af670815e3b37cdeb6a1ee6f34fe —
  sha256 над sorted-списком SHA-256 каждого файла assets/build/*
  (cube.mesh, texture.tex, triangle.mesh); рецепт — в notes.

notes: |-
  Снапшот 2026-11-05 (W1 hello_triangle): bench-режим
  `./build/pc-release/game/hello_triangle 60` — итог 28996 кадров за
  60058 мс, среднее fps=482.79; секундные окна 287–1160 fps (окно 1 ~1160 —
  прогрев Mesa, далее устойчиво ~375–570). Полка W1 («≥ 60 FPS на
  эталонном стенде») выполнена с запасом ≈ ×8. Бинарь pc-release
  (git_revision выше), дисплей поверх Mesa GL; рендер-фреймбуфер 320×240
  (nearest→окно 1280×960).
  Рецепт asset_set_sha256:
  `sha256sum assets/build/* | LC_ALL=C sort -k2 | awk '{print $1}' | sha256sum`.
  Предыдущий снапшот 2026-11-01 (W0-golden, 9af3ab8, assets
  src/render/shaders/* + tests/visual/*) снят на том же стенде; OSD/драйвер
  не менялись — эталоны tests/visual/reference/*.bin действительны.
  Перенос на другое OSD/драйвер: перезаписать поля и золотить эталон
  только через сознательный rebase (RENDER_GOLDEN_REBASE=1) с инженерным
  обоснованием в журнале.

ps1_emulator:
  build: ps1-release
  toolchain: PSn00bSDK v0.24 (pinned)
  renderer_backend: GTE+GPU+OT (320×240, NTSC)
  region: NTSC
  host_os: >-
    Freedesktop SDK 25.08 (Flatpak runtime), Linux 7.0.0-42 x86_64
  host_cpu: >-
    Intel Core i5-11300H (11th Gen, Tiger Lake-H35, 4C/8T @ 3.10–4.40 GHz)
  git_revision: >-
    0a19d94 (HEAD develop, S13–14 HAL PS1) + локальные изменения S15–16.
  asset_set_sha256: >-
    235ef802ce58341f22468aaaad603ba9f6b6af670815e3b37cdeb6a1ee6f34fe
  measurement: >-
    DuckStation 0.1-12640-gbb4e9ac5e, Software renderer, fast boot,
    NTSC-U, 60 s ручного прогона (2026-11-09). PerfMon: FPS 59.7–60.3
    (среднее ≈ 59.9), VPS 59.7–60.3, avg frame time ≈ 16.7 ms,
    эмулятор держит 100 % скорости (≥ 98 % гейт выполнен). Это
    emulator validation gate, НЕ доказательство 30 FPS на реальном
    железе. RAM: engine-owned static + арены ≈ 815 KiB
    (бюджет 1.5 MiB); VRAM: два 16bpp фреймбуфера 320×240 + CLUT +
    одна 256×256 texture page ≈ 366 KiB (бюджет 800 KiB).
    PS-EXE size: 96 256 bytes ≤ 512 000 bytes. Скриншот:
    screenshots/hello_triangle_ps1.png.
