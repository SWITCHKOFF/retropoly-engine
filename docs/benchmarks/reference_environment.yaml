# SPDX-License-Identifier: MIT
# RetroPolyEngine — docs/benchmarks/reference_environment.yaml
#
# Каркас метаданных эталонного окружения (docs/plans/sprint_07_08.md,
# неделя 16). НАЗНАЧЕНИЕ: любой повторный прогон эталонных замеров
# (W0-golden, benchmarks/memory_baseline.md и буд.) сопровождается
# снапшотом значений этого файла — числа без окружения недействительны.
#
# Политика обновления: при переносе эталонных прогонов на другое окружение
# ИЛИ при плановом апгрейде тулчейна значения перезаписываются, дата и
# причина — в notes (без изменения схемы). Полка «measurement» — только
# сравнение внутри одного снапшота (числа без окружения недействительны).
#
# Поля (норматив недель 16): os / cpu / gpu / driver / compiler /
# build_type / resolutions / vsync / power_mode / measurement_seconds /
# git_revision / asset_set_sha256.

os: >-
  Freedesktop SDK 25.08 (Flatpak runtime), Linux 7.0.0-42 x86_64

cpu: >-
  Intel Core i5-11300H (11th Gen, Tiger Lake-H35, 4C/8T @ 3.10–4.40 GHz)

gpu: >-
  VMware SVGA II Adapter (виртуализированный SVGA; GL-контекст через
  Mesa/userspace драйвер)

driver: >-
  Mesa GL (desktop, GL 3.3 core profile — требование render_opengl.cpp);
  версия уточняется на повторном прогоне (glxinfo отсутствовал в образе)

compiler: >-
  GCC 15.2.0 (mipsel-none-elf-g++ 12.3.0 для PS1-пресетов), CMake 4.4.4,
  Ninja 1.13.2

build_type: >-
  pc-debug-render для golden-эталонов (BUILD_RENDER_INTEGRATION_TESTS=ON,
  бинарь retro_engine_visual_tests); pc-release/pc-asan — замеры
  производительности/подавления диагностики; ps1-release — сборка ELF.

resolutions: >-
  [320×240 (reference framebuffer; nearest→окно), 1280×960 (окно HAL)]

vsync: >-
  off в контексте тестового процесса (кадр не ждёт вертикальной
  синхронизации; детерминизм readback от vsync не зависит).

power_mode: >-
  AC (сетевое питание); governor/частоты не пинились — «правило честных
  замеров»: сравнение только внутри одного снапшота этого файла.

measurement_seconds: 600

git_revision: >-
  caf8c06 (HEAD develop до S17–18) + локальные изменения Спринта 17–18.
  Снапшот окружения снят при стресс-замере W1-полки bench-режимом
  examples/rotating_cube (600 с, неделя 36).

asset_set_sha256: >-
  bf62abda74d26c6b7adbb5575d9bbe57f29c8c588f56f4dcb3e8562866d3007d —
  sha256 над sorted-списком SHA-256 каждого файла assets/build/*
  (cube.mesh, texture.tex, texture_{0..3}.tex, triangle.mesh); рецепт — в notes.

notes: |-
  Снапшот 2026-11-09 (W1 rotating_cube, Спринт 17–18): стресс-режим
  `./build/pc-release/game/rotating_cube 600` — итог 116736 кадров за
  600056 мс, среднее fps=194.54, минимум секундного окна 122, максимум 478
  (окно 1 — прогрев Mesa; устойчиво ~120–280). Гейт W1 («≥ 60 FPS на
  эталонном стенде») выполнен с запасом ≈ ×3.2 по среднему и ×2 по
  минимуму; 10 минут без краша/деградации (exit 0). Бинарь pc-release
  (git_revision выше), дисплей поверх Mesa GL; рендер-фреймбуфер 320×240
  (nearest→окно 1280×960). Сцена: 4 куба (48 треугольников, CI8/256,
  Gouraud + vertex lighting ambient+directional), 4 текстуры 256×256.
  Рецепт asset_set_sha256:
  `sha256sum assets/build/* | LC_ALL=C sort -k2 | awk '{print $1}' | sha256sum`.
  2026-11-16: набор assets/build расширен audio-ассетами
  (tone.xa/tone_*.rpa/json; см. `ps1_emulator.measurement`), поэтому
  текущий `asset_set_sha256` = 26d154c4…; W1-меш/4 текстуры не менялись.
  Исторический PC-снапшот 2026-11-09 использовал bf62abda… (без audio).
  2026-11-16: PC/PS1 parity fix — view-space вершины + projection-only
  в PC-шейдере; visual goldens (hello_triangle/rotating_cube/overlay)
  перебазированы, PC-скриншоты перегенерированы. PC FPS-числа 2026-11-09
  остаются для того же W1-ворклоада (fix убирает лишнюю матрицу, не
  добавляет нагрузку); см. `ps1_emulator.measurement`.
  Предыдущий снапшот 2026-11-05 (W1 hello_triangle, dfa123c): 60 с,
  среднее 482.79 fps — та же полка, другой ворклоад (1 треугольник); числа
  сравнимы только внутри ворклоада. Снапшот 2026-11-01 (W0-golden, 9af3ab8,
  assets src/render/shaders/* + tests/visual/*) снят на том же стенде;
  OSD/драйвер не менялись — эталоны tests/visual/reference/*.bin
  действительны (rotating_cube/overlay добавлены в S17–18 осознанным
  rebase по тому же протоколу).
  Перенос на другое OSD/драйвер: перезаписать поля и золотить эталон
  только через сознательный rebase (RENDER_GOLDEN_REBASE=1) с инженерным
  обоснованием в журнале.

ps1_emulator:
  build: ps1-release
  toolchain: PSn00bSDK v0.24 (pinned)
  renderer_backend: GTE+GPU+OT (320×240, NTSC)
  region: NTSC
  host_os: >-
    Linux Mint 22.3 (Ubuntu 24.04 base), Linux 7.0.0-43-generic x86_64;
    реальный X11 display :0 (X.Org 21.1.11, 1280×899)
  host_cpu: >-
    Intel Core i5-11300H (11th Gen, Tiger Lake-H35, 4 vCPU в VM,
    3.10–4.40 GHz; nproc=4)
  git_revision: >-
    d508ed2 (HEAD) + рабочее дерево на 2026-11-16 (S53–S66 и ручная
    приёмка S17–18; PS1-порт W1-сцены rotating_cube).
  asset_set_sha256: >-
    26d154c4f8e5c68172f3421ae6fe66e0b45cd4a53caf111f976c071dce80f7cd —
    sha256 над sorted-списком SHA-256 каждого файла assets/build/* на
    2026-11-16 (cube.mesh, texture_{0..3}.tex, tone.xa, tone_*.rpa/json;
    рецепт — в notes основного снапшота).
  measurement: >-
    DuckStation 0.1-12754-g82a118249 [master], Linux x64, Software
    renderer, fast boot, NTSC-U, VSync off, speed 100 %, реальный X11
    display (:0, X.Org 21.1.11, окно 640×480; не Xvfb); host GPU
    VMware SVGA3D/llvmpipe (Mesa 25.2.8-0ubuntu0.24.04.4, GL 4.1).
    Снапшот S17–18 (W1
    rotating_cube) — чистый 60-секундный прогон 2026-11-16 после
    прогрева, debug overlay выключен; 60 секундных окон PerfMon:
    FPS min/avg/median/max = 27.89 / 29.86 / 29.91 / 30.51, VPS =
    55.79 / 59.74 / 59.83 / 61.01, avg frame time 16.74 ms (окна
    16.39–17.92 ms), CPU avg 4.70 %, RNDR avg 15.56 %, GPU 0.00 %.
    OSD в конце окна: 29.93 FPS · 59.86 VPS · 100 % (100 %); engine
    overlay (Select): FPS 62, TRI 20, RAM 931K. Внутренний PerfMon FPS
    ≈ 30 — это поле 59.94/2 = 29.97 Гц (номинал 30 FPS PS1), поэтому
    гейт «PS1 ≥ 30 FPS» фиксируется по VPS 59.7 и engine FPS 62; ниже
    30 FPS опускается только счётчик внутренних GPU-кадров (min 27.89
    на одном host-stall окне, max frame 98.43 ms). RAM: engine-owned
    static + арены ≈ 931 KiB (бюджет 1.5 MiB); VRAM: два 16bpp
    фреймбуфера 320×240 + CLUT + 4 texture pages ≈ 494 KiB
    (бюджет 800 KiB). PS-EXE 122 880 bytes ≤ 512 000; CD-образ
    682 080 bytes. Сцена/приёмка: 4 куба (2 башни, 48 треугольников,
    4 текстуры 256×256, vertex lighting/Gouraud), фиксированная камера
    (0, 3.2, 7), AABB-коллизии пол/стек, прыжок Cross (+4.9, −9.8) с
    возвратом на пол/стек, debug overlay Select. Скриншоты:
    screenshots/rotating_cube_ps1.png (чистый F10),
    screenshots/rotating_cube_ps1_overlay.png (FPS 62/TRI 20/RAM 931K),
    screenshots/rotating_cube_ps1_perfmon.png (OSD 29.93 FPS / 59.86 VPS
    / 100 %), screenshots/rotating_cube_ps1_jump.png (прыжок) и
    screenshots/rotating_cube_ps1_landed.png (приземление/коллизии).
    10-минутный стресс (Xvfb :101, Software, overlay off, тот же ISO):
    634 с, 630 окон PerfMon, FPS 22.99/29.73/29.91/30.99, VPS
    45.16/59.46/59.82/61.73, 0 E/F/crash, graceful shutdown; на Xvfb
    больше host-stall'ов (max frame 315.37 ms), устойчивое состояние
    по-прежнему 29.9/59.8. Историческая справка: снапшот S15–16
    (hello_triangle, 2026-11-09, DuckStation 0.1-12640-gbb4e9ac5e):
    FPS/VPS 59.7–60.3, avg 16.7 ms, RAM ≈ 815 KiB, VRAM ≈ 366 KiB,
    PS-EXE 96 256 bytes, screenshots/hello_triangle_ps1.png. Это
    emulator validation gate, НЕ доказательство 30 FPS на реальном
    железе.
    PC/PS1 parity fix 2026-11-16: RenderTriCmd хранит view-space
    вершины, поэтому PC-шейдеру передаётся ТОЛЬКО projection (ранее —
    proj·view·model, double-transform; PC-кубы W1 рисовались ≈0.6
    масштаба). PS1 W1 геометрически корректен (GTE/H=171; кубы 2.0 ед.
    на z≈6.7). Все 16 visual-тестов rebased/зелёные,
    screenshots/rotating_cube_pc.png и hello_triangle_pc.png
    перегенерированы; композиция PC≡PS1, остаются raster-различия
    RGB555/affine/rounding.
