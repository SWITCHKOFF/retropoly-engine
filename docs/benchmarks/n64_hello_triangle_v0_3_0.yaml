  aliases:
    hello_n64.z64: hello_triangle.z64
    retro_n64.z64: rotating_cube.z64

asset_pipeline:
  converter: tools/asset_converter
  n64_flag: "--platform n64"
  output_format: ".tex v1 (CI8 + 256-entry CLUT; 64×64)"
  determinism: byte-identical repeated conversion
  mesh_format: ".mesh v1 unchanged (same bytes with/without --platform n64)"
  texture_example:
    source: assets/source/texture.png
    output_sha256: b05a986f2adce701b28b0d16a450f7c58b2731817cb39ba10b17bab08e856c8e
    width: 64
    height: 64

render:
  resolution: 320x240
  pixel_format: RGBA5551
  refresh_hz: 60
  depth:
    api: rdpq_attach(FMT_RGBA16)
    buffer_bytes: 153600
    internal_bits: 18
    clear: 0xFFFC
  rsp:
    overlay: src/hal/n64/rsp_tnl.S
    transform: "4x4 * vec4, Q16.16, 512 slots"
    lighting: "dot(n,L) on RSP; ambient/color scale on CPU"
    sync: "rspq_wait + D-cache invalidate"
  tmem:
    total_bytes: 4096
    texture_area_bytes: 2048
    tlut_bytes: 512
    strip_64x64_ci8: 2560
    strips_64x64: 2
  texture:
    source: "TEX0.TEX 256×256 → 64×64 nearest (runtime); --platform n64 emits 64×64"
    format: CI8 + 256-entry TLUT (RGB555+STP → RGBA5551)
    filter_textured: bilinear
    filter_untextured: point

