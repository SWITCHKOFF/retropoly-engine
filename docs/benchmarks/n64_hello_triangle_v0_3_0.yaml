    rdram_reported_bytes: 8388608
    ledger_base_bytes: 4194304
    engine_arenas_bytes: 2097152
    stack_bytes: 65536
    framebuffers_bytes: 307200
    z_buffer_bytes: 153600
    code_data_sdk_reserve_bytes: 1570816
    runtime_peak_rdram_bytes: 966492
    runtime_peak_limit_bytes: 3670016
    runtime_reserve_bytes: 524288
    heap: forbidden

