sprint: S45–46
release: v0.3.0-draft
engine_version: 0.3.0

reference_environment:
  host:
    os: Linux
    arch: x86_64
    display: "Xvfb 800x600x24"
    gpu: "llvmpipe (LLVM 20.1.2, Vulkan)"
  emulator:
    name: gopher64
    version: 1.2.1
    sha256: "4822cbb76298b59f4df65560f285acd29c3e8fd7cb714637794ddd15d6132369"
    settings:
      disable_expansion_pak: false
      overclock: false
      screen: 320x240
      region: NTSC
    command: >-
      xvfb-run -a -s "-screen 0 800x600x24" gopher64
      --disable-expansion-pak false --overclock false <rom>.z64
  build:
    preset: n64-release
    platform: PLATFORM_N64
    compiler: "mips64-elf-gcc 16.2.0"
    libdragon: "e356bf3f56f7afbf7e5246329562f145965cfdfc"
    libdragon_license: MIT
    toolchain_manifest: ci/n64-toolchain.sha256
    libdragon_manifest: ci/n64-libdragon.commit
